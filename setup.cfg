[metadata]
name = na6pdist
version = 0.1.0
description = NA60plus build CLI
long_description = file: README.md
long_description_content_type = text/markdown
author = NA60plus

[options]
packages = na6pdist
package_dir =
    na6pdist = .
include_package_data = True
install_requires =

[options.package_data]
na6pdist =
    recipes/*.sh

[options.entry_points]
console_scripts =
    na6pbuild = na6pdist.cli:main

[tool:pytest]
python_files = tests.py test_*.py *_tests.py
